<head>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>Everything 400</h1>

        <nav>

            <a href="./index.html">
                Home
            </a>

            <a href="./index.html#products">
                Shop
            </a>

            <a href="./index.html#products">
                Categories
            </a>

            <a
                href="./cart.html"
                id="cart-link"
            >
                Cart (0)
            </a>

            <a href="./track-order.html">
                Track Order
            </a>

        </nav>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main>

        <section class="cart-section">

            <h2>
                Your Shopping Cart
            </h2>


            <!-- =========================
                 CART ITEMS
            ========================== -->

            <div
                id="cart-items"
                class="cart-items"
            >

                <p>
                    Loading cart...
                </p>

            </div>


            <!-- =========================
                 CART SUMMARY
            ========================== -->

            <div class="cart-summary">

                <h3>

                    Total: Rs.

                    <span id="cart-total">
                        0
                    </span>

                </h3>


                <!-- =========================
                     PROCEED TO CHECKOUT
                ========================== -->

                <button
                    id="checkout-btn"
                    type="button"
                    class="checkout-button"
                >
                    Proceed to Checkout
                </button>

            </div>

    </main>


    <!-- =========================

    ========================== -->

    <footer>

        <p>
            © 2026 Everything 400. All Rights Reserved.
        </p>

    </footer>


    <!-- =========================
         SUPABASE LIBRARY
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =========================
         SUPABASE CONNECTION
    ========================== -->

    <script src="./supabase.js"></script>


    <!-- =========================
         MAIN JAVASCRIPT
    ========================== -->

    <script src="./script.js"></script>


    <!-- =========================
         PROCEED TO CHECKOUT
         SAFETY CLICK HANDLER
    ========================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                const checkoutButton =
                    document.getElementById(
                        "checkout-btn"
                    );

                if (!checkoutButton) {

                    console.error(
                        "Proceed to Checkout button not found."
                    );

                    return;
                }

                checkoutButton.addEventListener(
                    "click",
                    function() {

                        console.log(
                            "Proceed to Checkout clicked"
                        );

                        const savedCart =
                            localStorage.getItem(
                                "cart"
                            );

                        let currentCart = [];

                        try {

                            currentCart =
                                JSON.parse(
                                    savedCart
                                ) || [];

                        }
                        catch (error) {

                            console.error(
                                "Cart loading error:",
                                error
                            );

                            currentCart = [];
                        }

                        if (
                            !Array.isArray(
                                currentCart
                            ) ||
                            currentCart.length === 0
                        ) {

                            alert(
                                "Your cart is empty."
                            );

                            return;
                        }

                        window.location.href =
                            "./checkout.html";

                    }
                );

                console.log(
                    "Checkout button connected successfully."
                );

            }
        );

    </script>

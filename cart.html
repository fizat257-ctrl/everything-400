<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shopping Cart - Everything 400</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>Everything 400</h1>

        <nav>

            <a href="./index.html">
                Home
            </a>

            <a href="./index.html#products">
                Shop
            </a>

            <a href="./index.html#products">
                Categories
            </a>

            <a
                href="./cart.html"
                id="cart-link"
            >
                Cart (0)
            </a>

            <a href="./track-order.html">
                Track Order
            </a>

        </nav>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main>

        <section class="cart-section">

            <h2>
                Your Shopping Cart
            </h2>


            <!-- =========================
                 CART ITEMS
            ========================== -->

            <div
                id="cart-items"
                class="cart-items"
            >

                <p>
                    Loading cart...
                </p>

            </div>



            <!-- =========================
                 CART SUMMARY
            ========================== -->

            <div class="cart-summary">

                <h3>

                    Total: Rs.

                    <span id="cart-total">
                        0
                    </span>

                </h3>


                <button
                    id="checkout-btn"
                    type="button"
                >
                    Proceed to Checkout
                </button>

            </div>

        </section>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 Everything 400. All Rights Reserved.
        </p>

    </footer>



    <!-- =========================
         SUPABASE LIBRARY
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <!-- =========================
         SUPABASE CONNECTION
    ========================== -->

    <script src="./supabase.js"></script>



    <!-- =========================
         MAIN JAVASCRIPT
    ========================== -->

    <script src="./script.js"></script>


</body>

</html>

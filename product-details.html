<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details - Everything 400</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <h1>
            Everything 400
        </h1>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#products">
                Shop
            </a>

            <a href="cart.html">
                Cart (0)
            </a>

            <a href="trackorder.html">
                Track Order
            </a>

        </nav>

    </header>


    <!-- =====================================================
         MAIN PRODUCT DETAILS
    ====================================================== -->

    <main>

        <section class="product-details-section">

            <!-- PRODUCT DETAILS WILL LOAD HERE -->

            <div
                id="product-details"
                class="product-details-container"
            >

                <div class="product-loading">

                    <p>
                        Loading product...
                    </p>

                </div>

            </div>


            <!-- =================================================
                 REVIEWS SECTION
            ================================================== -->

            <section
                id="reviews-section"
                class="reviews-section"
            >

                <h2>
                    Customer Reviews
                </h2>


                <!-- AVERAGE RATING -->

                <div
                    id="product-rating-summary"
                    class="product-rating-summary"
                >

                    <div
                        id="average-rating"
                        class="average-rating"
                    >
                        ⭐ 0.0
                    </div>

                    <div
                        id="rating-count"
                        class="rating-count"
                    >
                        0 Reviews
                    </div>

                </div>


                <!-- =================================================
                     WRITE A REVIEW
                ================================================== -->

                <div
                    id="review-form-container"
                    class="review-form-container"
                >

                    <h3>
                        Write a Review
                    </h3>


                    <form
                        id="review-form"
                    >

                        <!-- CUSTOMER NAME -->

                        <label for="review-name">
                            Your Name
                        </label>

                        <input
                            type="text"
                            id="review-name"
                            name="review-name"
                            placeholder="Enter your name"
                            autocomplete="name"
                            required
                        >


                        <!-- STAR RATING -->

                        <label>
                            Your Rating
                        </label>

                        <div
                            id="star-rating"
                            class="star-rating"
                            role="radiogroup"
                            aria-label="Product rating"
                        >

                            <button
                                type="button"
                                class="star-btn"
                                data-rating="1"
                                aria-label="1 star"
                            >
                                ☆
                            </button>

                            <button
                                type="button"
                                class="star-btn"
                                data-rating="2"
                                aria-label="2 stars"
                            >
                                ☆
                            </button>

                            <button
                                type="button"
                                class="star-btn"
                                data-rating="3"
                                aria-label="3 stars"
                            >
                                ☆
                            </button>

                            <button
                                type="button"
                                class="star-btn"
                                data-rating="4"
                                aria-label="4 stars"
                            >
                                ☆
                            </button>

                            <button
                                type="button"
                                class="star-btn"
                                data-rating="5"
                                aria-label="5 stars"
                            >
                                ☆
                            </button>

                        </div>


                        <input
                            type="hidden"
                            id="review-rating"
                            name="review-rating"
                            value=""
                        >


                        <!-- REVIEW TEXT -->

                        <label for="review-text">
                            Your Review
                        </label>

                        <textarea
                            id="review-text"
                            name="review-text"
                            placeholder="Write your review..."
                            rows="5"
                            required
                        ></textarea>


                        <!-- REVIEW STATUS -->

                        <div
                            id="review-status"
                            class="review-status"
                            aria-live="polite"
                        ></div>


                        <!-- SUBMIT -->

                        <button
                            type="submit"
                            id="submit-review-btn"
                        >
                            Submit Review
                        </button>

                    </form>

                </div>


                <!-- =================================================
                     REVIEWS LIST
                ================================================== -->

                <div
                    id="reviews-list"
                    class="reviews-list"
                >

                    <p>
                        Loading reviews...
                    </p>

                </div>

            </section>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <p>
            © 2026 Everything 400. All Rights Reserved.
        </p>

    </footer>


    <!-- =====================================================
         SUPABASE LIBRARY
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         SUPABASE CONNECTION
    ====================================================== -->

    <script src="supabase.js"></script>


    <!-- =====================================================
         MAIN JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>

<!-- =====================================================
     WHATSAPP SUPPORT BUTTON
====================================================== -->

<a
    href="https://wa.me/923714358567?text=Hello%20Everything%20400%2C%20I%20need%20help."
    target="_blank"
    rel="noopener noreferrer"
    class="whatsapp-support-btn"
    aria-label="Contact us on WhatsApp"
>
    💬 WhatsApp Support
</a>
</body>

</html>

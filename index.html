<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Everything 400</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>
            Everything 400
        </h1>


        <nav>

            <a href="index.html">
                Home
            </a>


            <a href="#products">
                Shop
            </a>


            <a href="#products">
                Categories
            </a>


            <a
                href="cart.html"
                id="cart-link"
            >
                Cart (0)
            </a>


            <a href="track-order.html">
                Track Order
            </a>

        </nav>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main>


        <!-- =========================
             HERO
        ========================== -->

        <section class="hero">

            <h2>
                Everything You Love, Just Rs. 400
            </h2>


            <p>
                Discover amazing products at one simple price.
            </p>


            <button
                id="shop-now"
                type="button"
            >
                Shop Now
            </button>

        </section>



        <!-- =========================
             PRODUCTS
        ========================== -->

        <section
            class="products"
            id="products"
        >

            <h2>
                Shop Our Products
            </h2>



            <!-- =========================
                 SEARCH & FILTER CONTROLS
            ========================== -->

            <div class="product-controls">


                <!-- SEARCH -->

                <div class="search-box">

                    <input
                        type="search"
                        id="product-search"
                        placeholder="Search products..."
                        autocomplete="off"
                        aria-label="Search products"
                    >


                    <button
                        id="search-btn"
                        type="button"
                    >
                        Search
                    </button>

                </div>



                <!-- CATEGORY -->

                <div class="filter-box">

                    <label for="category-filter">
                        Category
                    </label>


                    <select
                        id="category-filter"
                    >

                        <option value="all">
                            All Categories
                        </option>

                        <option value="jewelry">
                            Jewelry
                        </option>

                        <option value="cosmetics">
                            Cosmetics
                        </option>

                        <option value="home">
                            Home
                        </option>

                        <option value="accessories">
                            Accessories
                        </option>

                    </select>

                </div>



                <!-- SORT -->

                <div class="sort-box">

                    <label for="sort-products">
                        Sort By
                    </label>


                    <select
                        id="sort-products"
                    >

                        <option value="default">
                            Default
                        </option>

                        <option value="price-low">
                            Price: Low to High
                        </option>

                        <option value="price-high">
                            Price: High to Low
                        </option>

                        <option value="name-a-z">
                            Name: A to Z
                        </option>

                        <option value="name-z-a">
                            Name: Z to A
                        </option>

                    </select>

                </div>



                <!-- CLEAR -->

                <button
                    id="clear-filters"
                    type="button"
                >
                    Clear Filters
                </button>

            </div>



            <!-- =========================
                 FILTER STATUS
            ========================== -->

            <div
                id="filter-status"
                class="filter-status"
                aria-live="polite"
            >
                Showing all products
            </div>



            <!-- =========================
                 PRODUCT CONTAINER
            ========================== -->

            <div
                class="product-container"
                id="product-container"
            >

                <p class="loading-products">
                    Loading products...
                </p>

            </div>

        </section>



        <!-- =========================
             PRODUCT DETAILS
        ========================== -->

        <section
            class="product-details-section"
            id="product-details-section"
            hidden
        >

            <div
                id="product-details"
                class="product-details"
            >

                <!-- Product details will appear here -->

            </div>

        </section>



        <!-- =========================
             PRODUCT ACTIONS
        ========================== -->

        <div
            id="product-action-area"
            class="product-action-area"
            hidden
        >

            <div class="quantity-control">

                <button
                    type="button"
                    id="quantity-decrease"
                >
                    -
                </button>


                <span id="product-quantity">
                    1
                </span>


                <button
                    type="button"
                    id="quantity-increase"
                >
                    +
                </button>

            </div>


            <p
                id="product-stock"
                class="product-stock"
            >
                Stock available
            </p>


            <button
                type="button"
                id="add-to-cart-detail"
            >
                Add to Cart
            </button>


            <button
                type="button"
                id="buy-now-detail"
            >
                Buy Now
            </button>

        </div>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 Everything 400. All Rights Reserved.
        </p>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="supabase.js"></script>


    <script src="script.js"></script>


</body>

</html>

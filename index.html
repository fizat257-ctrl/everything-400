<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Everything 400</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>
            Everything 400
        </h1>


        <nav>

            <a href="index.html">
                Home
            </a>


            <a href="#products">
                Shop
            </a>


            <a href="#products">
                Categories
            </a>


            <a
                href="cart.html"
                id="cart-link"
            >
                Cart (0)
            </a>


            <a href="track-order.html">
                Track Order
            </a>

        </nav>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main>


        <!-- =========================
             HERO
        ========================== -->

        <section class="hero">

            <h2>
                Everything You Love, Just Rs. 400
            </h2>


            <p>
                Discover amazing products at one simple price.
            </p>


            <button
                id="shop-now"
                type="button"
            >
                Shop Now
            </button>

        </section>



        <!-- =========================
             PRODUCTS
        ========================== -->

        <section
            class="products"
            id="products"
        >

            <h2>
                Shop Our Products
            </h2>



            <!-- =========================
                 SEARCH
            ========================== -->

            <div class="search-box">

                <input
                    type="text"
                    id="product-search"
                    placeholder="Search products..."
                    autocomplete="off"
                >


                <button
                    id="search-btn"
                    type="button"
                >
                    Search
                </button>

            </div>



            <!-- =========================
                 CATEGORIES
            ========================== -->

            <div class="categories">

                <button
                    class="category-btn active"
                    data-filter="all"
                    type="button"
                >
                    All
                </button>


                <button
                    class="category-btn"
                    data-filter="jewelry"
                    type="button"
                >
                    Jewelry
                </button>


                <button
                    class="category-btn"
                    data-filter="cosmetics"
                    type="button"
                >
                    Cosmetics
                </button>


                <button
                    class="category-btn"
                    data-filter="home"
                    type="button"
                >
                    Home
                </button>


                <button
                    class="category-btn"
                    data-filter="accessories"
                    type="button"
                >
                    Accessories
                </button>

            </div>



            <!-- =========================
                 PRODUCT CONTAINER
            ========================== -->

            <div
                class="product-container"
                id="product-container"
            >

                <p class="loading-products">
                    Loading products...
                </p>

            </div>

        </section>



        <!-- =========================
             PRODUCT DETAILS
             This section will be filled
             by script.js when a product
             is selected.
        ========================== -->

        <section
            class="product-details-section"
            id="product-details-section"
            hidden
        >

            <div
                id="product-details"
                class="product-details"
            >

                <!-- Product details will appear here -->

            </div>

        </section>



        <!-- =========================
             PRODUCT ACTIONS
             Ready for script.js
        ========================== -->

        <div
            id="product-action-area"
            class="product-action-area"
            hidden
        >

            <div class="quantity-control">

                <button
                    type="button"
                    id="quantity-decrease"
                >
                    -
                </button>


                <span id="product-quantity">
                    1
                </span>


                <button
                    type="button"
                    id="quantity-increase"
                >
                    +
                </button>

            </div>


            <p
                id="product-stock"
                class="product-stock"
            >
                Stock available
            </p>


            <button
                type="button"
                id="add-to-cart-detail"
            >
                Add to Cart
            </button>


            <button
                type="button"
                id="buy-now-detail"
            >
                Buy Now
            </button>

        </div>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 Everything 400. All Rights Reserved.
        </p>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->


    <!-- Supabase Library -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- Supabase Connection -->

    <script src="supabase.js"></script>


    <!-- Main Website JavaScript -->

    <script src="script.js"></script>


</body>

</html>

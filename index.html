<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Everything 400</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>Everything 400</h1>


        <nav>

            <a href="index.html">
                Home
            </a>


            <a href="#products">
                Shop
            </a>


            <a href="#products">
                Categories
            </a>


            <a
                href="cart.html"
                id="cart-link"
            >
                Cart (0)
            </a>

            <!-- Admin link removed
                 Admin Panel is kept separate -->


        </nav>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main>


        <!-- =========================
             HERO
        ========================== -->

        <section class="hero">

            <h2>
                Everything You Love, Just Rs. 400
            </h2>


            <p>
                Discover amazing products at one simple price.
            </p>


            <button id="shop-now">
                Shop Now
            </button>

        </section>



        <!-- =========================
             PRODUCTS
        ========================== -->

        <section
            class="products"
            id="products"
        >

            <h2>
                Shop Our Products
            </h2>


            <!-- SEARCH -->

            <div class="search-box">

                <input
                    type="text"
                    id="product-search"
                    placeholder="Search products..."
                    autocomplete="off"
                >


                <button id="search-btn">
                    Search
                </button>

            </div>



            <!-- =========================
                 CATEGORIES
            ========================== -->

            <div class="categories">

                <button
                    class="category-btn active"
                    data-filter="all"
                >
                    All
                </button>


                <button
                    class="category-btn"
                    data-filter="jewelry"
                >
                    Jewelry
                </button>


                <button
                    class="category-btn"
                    data-filter="cosmetics"
                >
                    Cosmetics
                </button>


                <button
                    class="category-btn"
                    data-filter="home"
                >
                    Home
                </button>


                <button
                    class="category-btn"
                    data-filter="accessories"
                >
                    Accessories
                </button>

            </div>



            <!-- =========================
                 SUPABASE PRODUCTS
            ========================== -->

            <div
                class="product-container"
                id="product-container"
            >

                <p class="loading-products">
                    Loading products...
                </p>

            </div>


        </section>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 Everything 400. All Rights Reserved.
        </p>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->


    <!-- Supabase Library -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- Supabase Connection -->

    <script src="supabase.js"></script>


    <!-- Main Website JavaScript -->

    <script src="script.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel - Everything 400</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <!-- =========================
         ADMIN HEADER
    ========================== -->

    <header class="admin-header">

        <div class="admin-brand">

            <h1>Everything 400</h1>

            <p>Admin Panel</p>

        </div>


        <div class="admin-header-actions">

            <a href="../index.html" class="view-store">
                View Store
            </a>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="admin-container">


        <!-- PAGE TITLE -->

        <section class="admin-title">

            <h2>Product Management</h2>

            <p>
                Add, edit and remove products from your store.
            </p>

        </section>


        <!-- =========================
             ADD PRODUCT
        ========================== -->

        <section class="admin-card">

            <h3>Add New Product</h3>

            <form id="product-form">


                <!-- PRODUCT NAME -->

                <div class="form-group">

                    <label for="product-name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="product-name"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="product-category">
                        Category
                    </label>

                    <select
                        id="product-category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="jewelry">
                            Jewelry
                        </option>

                        <option value="cosmetics">
                            Cosmetics
                        </option>

                        <option value="home">
                            Home
                        </option>

                        <option value="accessories">
                            Accessories
                        </option>

                    </select>

                </div>


                <!-- PRICE -->

                <div class="form-group">

                    <label for="product-price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="product-price"
                        value="400"
                        min="0"
                        required
                    >

                </div>


                <!-- IMAGE -->

                <div class="form-group">

                    <label for="product-image">
                        Product Image
                    </label>

                    <input
                        type="file"
                        id="product-image"
                        accept="image/*"
                    >

                </div>


                <!-- ADD BUTTON -->

                <button
                    type="submit"
                    class="add-product-btn"
                >
                    Add Product
                </button>

            </form>

        </section>


        <!-- =========================
             PRODUCT MANAGEMENT
        ========================== -->

        <section class="admin-card">

            <div class="products-heading">

                <div>

                    <h3>Products</h3>

                    <p>
                        Manage your store products.
                    </p>

                </div>


                <span id="product-count">
                    0 Products
                </span>

            </div>


            <!-- PRODUCTS WILL APPEAR HERE -->

            <div
                id="admin-products"
                class="admin-products"
            >

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 Everything 400 Admin Panel
        </p>

    </footer>


    <!-- =========================
         ADMIN JAVASCRIPT
    ========================== -->

    <script src="admin.js"></script>

</body>

</html>

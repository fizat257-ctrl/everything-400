<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track Order - Everything 400</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>Everything 400</h1>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#products">
                Shop
            </a>

            <a href="cart.html">
                Cart
            </a>

            <a href="track-order.html">
                Track Order
            </a>

        </nav>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main>

        <section class="track-order-section">

            <h2>
                Track Your Order
            </h2>

            <p>
                Enter your Order ID to check your latest order status.
            </p>


            <!-- ORDER ID FORM -->

            <form id="track-order-form">

                <label for="order-id">
                    Order ID
                </label>

                <input
                    type="text"
                    id="order-id"
                    placeholder="Enter your Order ID"
                    required
                >

                <button
                    type="submit"
                >
                    Track Order
                </button>

            </form>


            <!-- RESULT -->

            <div
                id="track-order-result"
                class="track-order-result"
            >

                <p>
                    Enter your Order ID to see your order status.
                </p>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 Everything 400. All Rights Reserved.
        </p>

    </footer>


    <!-- =========================
         SUPABASE LIBRARY
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================
         SUPABASE CONNECTION
    ========================== -->

    <script src="supabase.js"></script>


    <!-- =========================
         TRACK ORDER JAVASCRIPT
    ========================== -->

    <script>

        const db = window.supabaseClient;

        const trackForm =
            document.getElementById("track-order-form");

        const orderIdInput =
            document.getElementById("order-id");

        const resultContainer =
            document.getElementById("track-order-result");


        // =========================
        // ESCAPE HTML
        // =========================

        function escapeHTML(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // =========================
        // STATUS MESSAGE
        // =========================

        function getStatusMessage(status) {

            const currentStatus =
                String(status || "Pending")
                    .toLowerCase()
                    .trim();


            if (currentStatus === "pending") {

                return "Your order is pending.";

            }


            if (
                currentStatus === "confirm" ||
                currentStatus === "confirmed"
            ) {

                return "Your order has been confirmed.";

            }


            if (
                currentStatus === "ship" ||
                currentStatus === "shipped"
            ) {

                return "Your order has been shipped.";

            }


            if (
                currentStatus === "delivery" ||
                currentStatus === "delivered"
            ) {

                return "Your order has been delivered.";

            }


            if (
                currentStatus === "cancel" ||
                currentStatus === "cancelled" ||
                currentStatus === "canceled"
            ) {

                return "Your order has been cancelled.";

            }


            return "Your order is being processed.";

        }


        // =========================
        // TRACK ORDER
        // =========================

        if (trackForm) {

            trackForm.addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const orderId =
                        orderIdInput.value.trim();


                    if (!orderId) {

                        resultContainer.innerHTML =
                            "<p>Please enter your Order ID.</p>";

                        return;

                    }


                    if (!db) {

                        resultContainer.innerHTML =
                            "<p>Database connection is not available.</p>";

                        return;

                    }


                    resultContainer.innerHTML =
                        "<p>Loading order...</p>";


                    try {

                        const result =
                            await db
                                .from("orders")
                                .select("*")
                                .eq("id", orderId)
                                .maybeSingle();


                        if (result.error) {

                            console.error(
                                "Track order error:",
                                result.error
                            );

                            resultContainer.innerHTML =
                                "<p>Unable to find this order.</p>";

                            return;

                        }


                        if (!result.data) {

                            resultContainer.innerHTML =
                                "<p>No order found with this Order ID.</p>";

                            return;

                        }


                        const order =
                            result.data;


                        const status =
                            order.status || "Pending";


                        const message =
                            getStatusMessage(status);


                        const orderDate =
                            order.created_at
                                ? new Date(
                                    order.created_at
                                ).toLocaleString()
                                : "Not available";


                        const total =
                            Number(
                                order.total || 0
                            ).toLocaleString();


                        resultContainer.innerHTML = `

                            <div class="order-tracking-card">

                                <h3>
                                    Order Details
                                </h3>


                                <p>
                                    <strong>
                                        Order ID:
                                    </strong>

                                    ${escapeHTML(order.id)}
                                </p>


                                <p>
                                    <strong>
                                        Customer:
                                    </strong>

                                    ${escapeHTML(
                                        order.customer_name ||
                                        "Customer"
                                    )}
                                </p>


                                <p>
                                    <strong>
                                        Phone:
                                    </strong>

                                    ${escapeHTML(
                                        order.customer_phone ||
                                        "Not available"
                                    )}
                                </p>


                                <p>
                                    <strong>
                                        Address:
                                    </strong>

                                    ${escapeHTML(
                                        order.customer_address ||
                                        "Not available"
                                    )}
                                </p>


                                <p>
                                    <strong>
                                        City:
                                    </strong>

                                    ${escapeHTML(
                                        order.customer_city ||
                                        "Not available"
                                    )}
                                </p>


                                <p>
                                    <strong>
                                        Order Date:
                                    </strong>

                                    ${escapeHTML(orderDate)}
                                </p>


                                <p>
                                    <strong>
                                        Current Status:
                                    </strong>

                                    <span>
                                        ${escapeHTML(status)}
                                    </span>
                                </p>


                                <p class="status-message">
                                    ${escapeHTML(message)}
                                </p>


                                <p>
                                    <strong>
                                        Total:
                                    </strong>

                                    Rs. ${total}
                                </p>


                                <div class="tracking-steps">

                                    <div class="tracking-step">
                                        1. Pending
                                    </div>

                                    <div class="tracking-step">
                                        2. Confirmed
                                    </div>

                                    <div class="tracking-step">
                                        3. Shipped
                                    </div>

                                    <div class="tracking-step">
                                        4. Delivered
                                    </div>

                                    <div class="tracking-step">
                                        5. Cancelled
                                    </div>

                                </div>

                            </div>

                        `;

                    } catch (error) {

                        console.error(
                            "Tracking error:",
                            error
                        );


                        resultContainer.innerHTML =
                            "<p>Something went wrong while tracking your order.</p>";

                    }

                }
            );

        }

    </script>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout - Everything 400</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <h1>
            Everything 400
        </h1>

        <nav>

            <a href="./index.html">
                Home
            </a>

            <a href="./index.html#products">
                Shop
            </a>

            <a href="./cart.html">
                Cart
            </a>

        </nav>

    </header>


    <!-- =====================================================
         MAIN CHECKOUT
    ====================================================== -->

    <main>

        <section class="checkout-section">

            <h2>
                Checkout
            </h2>


            <div class="checkout-container">


                <!-- =================================================
                     CUSTOMER INFORMATION
                ================================================== -->

                <div class="checkout-form">

                    <h3>
                        Customer Information
                    </h3>


                    <form
                        id="checkout-form"
                    >


                        <!-- FULL NAME -->

                        <label for="customer-name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="customer-name"
                            name="customer-name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >


                        <!-- PHONE -->

                        <label for="customer-phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="customer-phone"
                            name="customer-phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                            required
                        >


                        <!-- EMAIL -->

                        <label for="customer-email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="customer-email"
                            name="customer-email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                        >


                        <!-- ADDRESS -->

                        <label for="customer-address">
                            Complete Address
                        </label>

                        <textarea
                            id="customer-address"
                            name="customer-address"
                            placeholder="Enter your complete address"
                            autocomplete="street-address"
                            required
                        ></textarea>


                        <!-- CITY -->

                        <label for="customer-city">
                            City
                        </label>

                        <input
                            type="text"
                            id="customer-city"
                            name="customer-city"
                            placeholder="Enter your city"
                            autocomplete="address-level2"
                            required
                        >


                        <!-- =================================================
                             PAYMENT METHOD
                        ================================================== -->

                        <div class="payment-method-section">

                            <h3>
                                Payment Method
                            </h3>


                            <!-- CASH ON DELIVERY -->

                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment-method"
                                    value="Cash on Delivery"
                                    required
                                >

                                <span>
                                    Cash on Delivery
                                </span>

                            </label>


                            <!-- JAZZCASH -->

                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment-method"
                                    value="JazzCash"
                                >

                                <span>
                                    JazzCash
                                </span>

                            </label>


                            <!-- EASYPAISA -->

                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment-method"
                                    value="Easypaisa"
                                >

                                <span>
                                    Easypaisa
                                </span>

                            </label>


                            <!-- CARD PAYMENT -->

                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment-method"
                                    value="Card Payment"
                                >

                                <span>
                                    Card Payment
                                </span>

                            </label>


                            <small class="payment-note">

                                Select your preferred payment method.

                            </small>

                        </div>


                        <!-- =================================================
                             ORDER STATUS
                        ================================================== -->

                        <div
                            id="customer-order-status"
                            class="customer-order-status"
                        ></div>


                        <!-- =================================================
                             PLACE ORDER
                        ================================================== -->

                        <button
                            type="submit"
                            id="checkout-btn"
                        >
                            Place Order
                        </button>


                    </form>

                </div>


                <!-- =================================================
                     ORDER SUMMARY
                ================================================== -->

                <div class="order-summary">

                    <h3>
                        Order Summary
                    </h3>


                    <div id="checkout-items">

                        <p>
                            Loading order summary...
                        </p>

                    </div>


                    <div class="checkout-total">

                        <strong>

                            Total: Rs.

                            <span id="checkout-total">
                                0
                            </span>

                        </strong>

                    </div>

                </div>


            </div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <p>
            © 2026 Everything 400. All Rights Reserved.
        </p>

    </footer>


    <!-- =====================================================
         SUPABASE LIBRARY
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         SUPABASE CONNECTION
    ====================================================== -->

    <script src="./supabase.js"></script>


    <!-- =====================================================
         MAIN JAVASCRIPT
    ====================================================== -->

    <script src="./script.js"></script>


</body>

</html>
